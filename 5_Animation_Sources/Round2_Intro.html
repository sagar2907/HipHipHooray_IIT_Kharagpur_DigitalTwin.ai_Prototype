<!doctype html>
<title>DigitalTwin.ai — Team Intro</title>
<style>
  :root{--bg:#0b0d12;--ink:#e9ebf0;--muted:#98a0b2;--purple:#b98cff;--purple2:#d6bcff;--line:#242833}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);width:1280px;height:720px;overflow:hidden}
  #stage{width:1280px;height:720px;display:flex;flex-direction:column;align-items:center;
         justify-content:center;font-family:Arial,Helvetica,sans-serif;color:var(--ink);
         opacity:0;transition:opacity 900ms ease}
  #stage.on{opacity:1}
  .kicker{font:700 16px Arial;letter-spacing:.16em;color:var(--purple2);margin-bottom:14px;
          text-transform:uppercase}
  h1{font:800 56px Arial;margin:0 0 22px;letter-spacing:-.01em}
  .team{display:flex;gap:64px;margin-top:8px}
  .card{text-align:center}
  .name{font:700 24px Arial;color:var(--ink)}
  .role{font:600 14px Arial;color:var(--purple2);margin-top:4px}
  .dept{font:400 14px Arial;color:var(--muted);margin-top:2px}
  .rule{width:64px;height:3px;background:var(--purple);margin:16px auto 24px;border-radius:2px}
  .foot{margin-top:40px;font:400 15px Arial;color:var(--muted);letter-spacing:.02em}
  .foot b{color:var(--ink);font-weight:700}
</style>
<div id="stage">
  <div class="kicker">Accenture Innovation Challenge 2026 &nbsp;·&nbsp; Problem Track 4 &nbsp;·&nbsp; Round 2</div>
  <h1>DigitalTwin.ai</h1>
  <div class="rule"></div>
  <div class="team">
    <div class="card">
      <div class="name">Sagar Sahu</div>
      <div class="role">Team Leader</div>
      <div class="dept">Ocean Engineering &amp; Naval Architecture · IIT Kharagpur</div>
    </div>
    <div class="card">
      <div class="name">Priyansh Goyal</div>
      <div class="role">&nbsp;</div>
      <div class="dept">Electronics &amp; Communication · IIT Kharagpur</div>
    </div>
  </div>
  <div class="foot">Team <b>HipHipHooray</b></div>
</div>
<script>requestAnimationFrame(()=>requestAnimationFrame(()=>{
  document.getElementById('stage').classList.add('on');
}));</script>
